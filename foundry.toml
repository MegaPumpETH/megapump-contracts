[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
solc    = "0.8.24"
optimizer       = true
optimizer_runs  = 200
via_ir          = true
# Read-only access for the tests that load reference bytecode (v1 implementation, DEX contracts)
fs_permissions  = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 10000

# CI (FOUNDRY_PROFILE=ci): same compiler settings, fewer fuzz runs
[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
# Testnet (Chain ID: 6343) — public endpoint, rate limited
megaeth_testnet = "https://carrot.megaeth.com/rpc"
# Mainnet (Chain ID: 4326)
megaeth_mainnet = "https://alpha.megaeth.com/rpc"


# Dependencies — install with:
#   forge install OpenZeppelin/openzeppelin-contracts
#   forge install OpenZeppelin/openzeppelin-contracts-upgradeable
[dependencies]
"@openzeppelin/contracts"            = { version = "5.0.2", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.0.2" }
"@openzeppelin/contracts-upgradeable" = { version = "5.0.2", git = "https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git", tag = "v5.0.2" }