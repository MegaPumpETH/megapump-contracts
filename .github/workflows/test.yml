name: CI
permissions: {}
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  FOUNDRY_PROFILE: ci
jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Show Forge version
        run: forge --version
      - name: Run Forge build
        run: forge build --sizes
      - name: Run Forge tests (unit)
        run: forge test --no-match-contract "GraduationForkTest" -vvv